<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Đèn Xanh - Đèn Đỏ (Phaser 3)</title>
    <!-- Thêm thư viện Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(to bottom, #2c3e50, #3498db);
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        #title {
            margin-top: 20px;
            font-size: 36px;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: none;
            overflow: hidden;
            background-color: #87CEEB;
        }

        #startBtn {
            margin-top: 40px;
            padding: 15px 50px;
            font-size: 24px;
            cursor: pointer;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #startBtn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.6);
        }

        #startBtn:active {
            transform: translateY(1px);
        }

        /* Nút Tạm Dừng */
        #pauseBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #2c3e50;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: all 0.2s;
        }

        #pauseBtn:hover {
            transform: scale(1.1);
            background: white;
        }

        #pauseBtn span {
            width: 5px;
            height: 18px;
            background: #2c3e50;
            display: inline-block;
            margin: 0 3px;
            border-radius: 2px;
        }

        /* Overlay Tạm Dừng */
        #pauseOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        #pauseMenu {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            color: #2c3e50;
            border: 5px solid #3498db;
        }

        #pauseMenu h2 {
            margin-bottom: 30px;
            font-size: 32px;
            color: #2980b9;
        }

        .menuBtn {
            display: block;
            width: 220px;
            padding: 15px;
            margin: 15px auto;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        #resumeBtn {
            background: #2ecc71;
            color: white;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }

        #exitBtn {
            background: #e74c3c;
            color: white;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .menuBtn:hover {
            transform: translateY(-3px) scale(1.05);
        }

        /* Overlay Kết Thúc */
        #winOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(46, 204, 113, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            backdrop-filter: blur(8px);
        }

        #winMenu {
            background: white;
            padding: 50px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            color: #2c3e50;
            border: 8px solid #f1c40f;
            max-width: 500px;
        }

        #winMenu h2 {
            font-size: 48px;
            color: #27ae60;
            margin-bottom: 10px;
        }

        #winMenu p {
            font-size: 24px;
            margin-bottom: 30px;
        }

        #replayBtn {
            background: #3498db;
            color: white;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
    </style>
</head>

<body>

    <div id="title">Giao Thông An Toàn</div>
    <button id="startBtn">BẮT ĐẦU CHƠI</button>
    <div id="game-container"></div>

    <button id="pauseBtn"><span></span><span></span></button>

    <div id="pauseOverlay">
        <div id="pauseMenu">
            <h2>Đang Tạm Dừng</h2>
            <button id="resumeBtn" class="menuBtn">TIẾP TỤC</button>
            <button id="exitBtn" class="menuBtn">THOÁT</button>
        </div>
    </div>

    <div id="winOverlay">
        <div id="winMenu">
            <h2 id="winTitle">CHÚC MỪNG BÉ!</h2>
            <p id="winMsg">Bé đã tham gia giao thông rất giỏi và tới trường an toàn rồi!</p>
            <button id="replayBtn" class="menuBtn">CHƠI LẠI</button>
            <button id="winExitBtn" class="menuBtn" style="background: #e74c3c; color: white;">THOÁT</button>
        </div>
    </div>

    <audio id="bgMusic" loop src="media/Coconut Kind of Love.mpga"></audio>
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playWarningBeep() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);

            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        function speakTTS(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'vi-VN';

            const voices = window.speechSynthesis.getVoices();
            const viVoices = voices.filter(voice => voice.lang.includes('vi'));

            let selectedVoice = viVoices.find(v => v.name.includes('Natural') || v.name.includes('HoaiMy') || v.name.includes('Google'));
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            } else if (viVoices.length > 0) {
                utterance.voice = viVoices[0];
            }

            utterance.pitch = 1.4;
            utterance.rate = 0.95;
            utterance.volume = 0.5;

            window.speechSynthesis.speak(utterance);
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
        }
        const config = {
            type: Phaser.AUTO,
            scale: {
                mode: Phaser.Scale.RESIZE,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: '100%',
                height: '100%'
            },
            parent: 'game-container',
            backgroundColor: '#87CEEB',
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        let game;
        const startBtn = document.getElementById('startBtn');
        const gameContainer = document.getElementById('game-container');

        let isPlaying = false;
        let lastSwitchTime = 0;
        let roadSpeed = 3;

        let lines = [];
        let gardenItems = [];
        let fenceItemsL = [];
        let fenceItemsR = [];
        let car;
        let lightState = 'GREEN';
        let redLight, yellowLight, greenLight, redGlow, yellowGlow, greenGlow;
        let trafficLightContainer;
        let countdownText;
        let crosswalk;
        let vibrateTween;
        let brakeGlowL, brakeGlowR;
        let smokeEmitter;

        let teacher, teacherBubble, bubbleText, bubbleContent;
        let currentEffect = null;
        let finishLine;
        let isGameOver = false;
        let cycleCount = 0;

        function playEffect(src) {
            if (currentEffect) {
                currentEffect.pause();
                currentEffect.currentTime = 0;
            }
            currentEffect = new Audio(src);
            currentEffect.play().catch(e => console.log("Lỗi phát âm thanh:", e));
        }

        startBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            startBtn.style.display = 'none';
            gameContainer.style.display = 'block';

            let bgMusic = document.getElementById('bgMusic');
            if (bgMusic) {
                bgMusic.volume = 0.05;
                bgMusic.play().catch(e => console.log("Không thể phát nhạc:", e));
            }

            if (!game) {
                game = new Phaser.Game(config);
            }
            document.getElementById('pauseBtn').style.display = 'flex';
        });

        const pauseBtn = document.getElementById('pauseBtn');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const resumeBtn = document.getElementById('resumeBtn');
        const exitBtn = document.getElementById('exitBtn');

        pauseBtn.addEventListener('click', () => {
            document.getElementById('pauseOverlay').style.display = 'flex';
            isPlaying = false;
            if (game) game.scene.scenes[0].scene.pause();

            // Tạm dừng tất cả âm thanh hiệu ứng
            activeAudios.forEach(audio => audio.pause());

            // Tạm dừng nhạc nền nếu có
            let bgMusic = document.getElementById('bgMusic');
            if (bgMusic) bgMusic.pause();
            pauseBtn.style.display = 'none';
        });

        resumeBtn.addEventListener('click', () => {
            document.getElementById('pauseOverlay').style.display = 'none';
            isPlaying = true;
            if (game) game.scene.scenes[0].scene.resume();

            // Phát tiếp các âm thanh
            activeAudios.forEach(audio => audio.play().catch(e => { }));

            // Phát tiếp nhạc nền
            let bgMusic = document.getElementById('bgMusic');
            if (bgMusic) bgMusic.play().catch(e => { });
            pauseBtn.style.display = 'flex';
        });

        exitBtn.addEventListener('click', () => {
            location.reload();
        });

        document.getElementById('replayBtn').addEventListener('click', () => {
            location.reload();
        });

        document.getElementById('winExitBtn').addEventListener('click', () => {
            location.reload();
        });

        function preload() {
            this.load.image('teacherImg', 'img/co-giao.png');
        }

        function create() {
            const { width, height } = this.cameras.main;
            const centerX = width / 2;
            const centerY = height / 2;
            const roadWidth = 500; // Mở rộng đường lên 500px (từ 240px)
            const roadLeft = centerX - roadWidth / 2;
            const roadRight = centerX + roadWidth / 2;

            // --- TẠO CÔ GIÁO VÀ BONG BÓNG NÓI ---
            teacher = this.add.image(width * 0.1, height * 0.8, 'teacherImg').setScale(0.15).setDepth(100);
            teacherBubble = this.add.container(width * 0.1, height * 0.6).setAlpha(0).setDepth(101);
            let bubbleBg = this.add.graphics();

            bubbleContent = this.add.text(0, 0, '', {
                fontSize: '18px',
                color: '#000',
                fontStyle: 'bold',
                fontFamily: 'Arial',
                align: 'center',
                wordWrap: { width: 220 }
            }).setOrigin(0.5);

            teacherBubble.add([bubbleBg, bubbleContent]);

            this.teacherSay = (text, duration = 3000) => {
                bubbleContent.setText(text);

                // Tính toán kích thước linh hoạt
                let padding = 20;
                let bW = bubbleContent.width + padding * 2;
                let bH = bubbleContent.height + padding * 2;
                if (bW < 120) bW = 120;

                // Vẽ lại nền dựa trên kích thước chữ
                bubbleBg.clear();
                bubbleBg.fillStyle(0xffffff, 1);
                bubbleBg.fillRoundedRect(0, 0, bW, bH, 15);
                bubbleBg.lineStyle(2, 0x2c3e50, 1);
                bubbleBg.strokeRoundedRect(0, 0, bW, bH, 15);

                // Vẽ đuôi bong bóng
                bubbleBg.fillTriangle(20, bH, 40, bH, 30, bH + 15);
                bubbleBg.strokeTriangle(20, bH, 40, bH, 30, bH + 15);

                // Căn giữa chữ vào box
                bubbleContent.setPosition(bW / 2, bH / 2);

                teacherBubble.setAlpha(1);

                this.tweens.add({
                    targets: teacherBubble,
                    y: height * 0.4,
                    duration: 200,
                    ease: 'Power1'
                });

                if (this.sayTimer) this.sayTimer.remove();
                this.sayTimer = this.time.delayedCall(duration, () => {
                    this.tweens.add({
                        targets: teacherBubble,
                        alpha: 0,
                        y: height * 0.6,
                        duration: 200
                    });
                });
            };

            let g = this.make.graphics({ x: 0, y: 0, add: false });
            g.fillStyle(0xffffff, 1);
            g.fillCircle(8, 8, 8);
            g.generateTexture('smoke_particle', 16, 16);

            playEffect('media/denxanh.wav');
            this.teacherSay("Đèn xanh rồi các bạn nhỏ ơi, đèn xanh thì chúng ta phải làm gì nhỉ ?", 8000);

            this.add.rectangle(roadLeft / 2, centerY, roadLeft, height, 0x27ae60);
            this.add.rectangle(roadRight + (width - roadRight) / 2, centerY, width - roadRight, height, 0x27ae60);

            this.add.rectangle(roadLeft / 4, centerY, roadLeft / 2, height, 0x219a52);
            this.add.rectangle(width - (width - roadRight) / 4, centerY, (width - roadRight) / 2, height, 0x219a52);

            const drawTreeInContainer = (scene, tx, ty) => {
                let c = scene.add.container(tx, ty);
                c.add(scene.add.rectangle(0, 30, 12, 50, 0x6D4C2A));
                c.add(scene.add.circle(0, -5, 28, 0x1B8A3D));
                c.add(scene.add.circle(-15, 5, 18, 0x22A848));
                c.add(scene.add.circle(15, 5, 18, 0x22A848));
                c.add(scene.add.circle(0, -20, 15, 0x2ECC71));
                return c;
            };

            const drawFlowerBushInContainer = (scene, fx, fy) => {
                let c = scene.add.container(fx, fy);
                c.add(scene.add.circle(0, 0, 14, 0x1D8E40));
                c.add(scene.add.circle(-8, 5, 10, 0x239B4A));
                c.add(scene.add.circle(8, 5, 10, 0x239B4A));
                c.add(scene.add.circle(-5, -6, 4, 0xFF6B9D));
                c.add(scene.add.circle(7, -3, 4, 0xFFD700));
                c.add(scene.add.circle(0, 2, 3, 0xFF4757));
                c.add(scene.add.circle(10, 8, 3, 0xE056A0));
                return c;
            };

            const drawBenchInContainer = (scene, bx, by) => {
                let c = scene.add.container(bx, by);
                c.add(scene.add.rectangle(0, 0, 40, 6, 0x8B5E3C));
                c.add(scene.add.rectangle(0, 4, 36, 4, 0x6D4C2A));
                c.add(scene.add.rectangle(-16, 10, 4, 12, 0x555555));
                c.add(scene.add.rectangle(16, 10, 4, 12, 0x555555));
                return c;
            };

            const drawLampInContainer = (scene, lx, ly) => {
                let c = scene.add.container(lx, ly);
                c.add(scene.add.rectangle(0, 30, 6, 60, 0x7f8c8d));
                c.add(scene.add.circle(0, 0, 10, 0xF39C12, 0.8));
                c.add(scene.add.circle(0, 0, 16, 0xF1C40F, 0.25));
                return c;
            };

            const drawFencePost = (scene, fx, fy) => {
                let c = scene.add.container(fx, fy);
                c.add(scene.add.rectangle(0, 0, 4, 40, 0x8B5E3C));
                c.add(scene.add.rectangle(0, -10, 16, 4, 0x8B5E3C));
                c.add(scene.add.rectangle(0, 10, 16, 4, 0x8B5E3C));
                return c;
            };

            for (let fy = -50; fy < height + 100; fy += 60) {
                fenceItemsL.push(drawFencePost(this, roadLeft - 15, fy));
            }

            for (let fy = -50; fy < height + 100; fy += 60) {
                fenceItemsR.push(drawFencePost(this, roadRight + 15, fy));
            }


            const addGardenItem = (itemFunc, side) => {
                let rx = (side === 'L') ? Phaser.Math.Between(30, roadLeft - 50) : Phaser.Math.Between(roadRight + 50, width - 30);
                let ry = Phaser.Math.Between(-100, height + 100);
                gardenItems.push(itemFunc(this, rx, ry));
            };

            for (let i = 0; i < 5; i++) {
                addGardenItem(drawTreeInContainer, 'L');
                addGardenItem(drawTreeInContainer, 'R');
                addGardenItem(drawFlowerBushInContainer, 'L');
                addGardenItem(drawFlowerBushInContainer, 'R');
                if (i < 2) {
                    addGardenItem(drawBenchInContainer, 'L');
                    addGardenItem(drawBenchInContainer, 'R');
                    addGardenItem(drawLampInContainer, 'L');
                    addGardenItem(drawLampInContainer, 'R');
                }
            }

            // Vỉa hè lát gạch 2 bên đường
            this.add.rectangle(roadLeft - 7, centerY, 14, height, 0xBDC3C7);
            this.add.rectangle(roadRight + 7, centerY, 14, height, 0xBDC3C7);

            // 1. Vẽ Lòng Đường
            this.add.rectangle(centerX, centerY, roadWidth, height, 0x555555);

            // Viền đường (Vạch liền)
            this.add.rectangle(roadLeft + 5, centerY, 6, height, 0xffffff);
            this.add.rectangle(roadRight - 5, centerY, 6, height, 0xffffff);

            // 4. Vạch kẻ đường (Vạch đứt)
            for (let i = 0; i < 15; i++) {
                let line = this.add.rectangle(centerX, i * 60 - 30, 8, 30, 0xffffff);
                lines.push(line);
            }

            // --- PARTICLE EMITTER (KHÓI ỐNG XẢ) ---
            smokeEmitter = this.add.particles(0, 0, 'smoke_particle', {
                x: { min: -20, max: 20 },
                y: 50,
                lifespan: 800,
                speedY: { min: 50, max: 150 },
                speedX: { min: -15, max: 15 },
                scale: { start: 0.5, end: 1.5 },
                alpha: { start: 0.5, end: 0 },
                blendMode: 'NORMAL',
                emitting: false
            });

            // 5. Vạch đi bộ (Hiển thị khi đèn đỏ)
            crosswalk = this.add.container(centerX, centerY + 80);
            let numStripes = Math.floor(roadWidth / 35);
            for (let i = 0; i < numStripes; i++) {
                let stripe = this.add.rectangle(-(numStripes * 15) + i * 35, 0, 20, 100, 0xffffff);
                crosswalk.add(stripe);
            }
            crosswalk.setAlpha(0);

            // 6. ĐÈN GIAO THÔNG NGANG Ở GIỮA
            trafficLightContainer = this.add.container(centerX, 80);
            let tlBox = this.add.rectangle(0, 0, 220, 70, 0x2c3e50).setStrokeStyle(4, 0x1a252f);
            let tlBoxInner = this.add.rectangle(0, 0, 212, 62, 0x34495e);
            trafficLightContainer.add([tlBox, tlBoxInner]);

            let redDark = this.add.circle(-70, 0, 24, 0x4a0000);
            let yellowDark = this.add.circle(0, 0, 24, 0x4a4a00);
            let greenDark = this.add.circle(70, 0, 24, 0x004a00);
            trafficLightContainer.add([redDark, yellowDark, greenDark]);

            redGlow = this.add.circle(-70, 0, 38, 0xff0000, 0.4).setAlpha(0);
            redLight = this.add.circle(-70, 0, 24, 0xff3333).setAlpha(0);
            yellowGlow = this.add.circle(0, 0, 38, 0xffff00, 0.4).setAlpha(0);
            yellowLight = this.add.circle(0, 0, 24, 0xffff33).setAlpha(0);
            greenGlow = this.add.circle(70, 0, 38, 0x00ff00, 0.4).setAlpha(1);
            greenLight = this.add.circle(70, 0, 24, 0x33ff33).setAlpha(1);
            trafficLightContainer.add([redGlow, redLight, yellowGlow, yellowLight, greenGlow, greenLight]);

            countdownText = this.add.text(centerX, 300, '', {
                fontSize: '96px',
                fontFamily: 'Arial Black, Arial, sans-serif',
                color: '#FFD700',
                stroke: '#000000',
                strokeThickness: 8,
                shadow: { offsetX: 3, offsetY: 3, color: '#000', blur: 8, fill: true }
            }).setOrigin(0.5).setAlpha(0).setDepth(100);

            // 6.5. Vạch đích (ẩn ban đầu)
            finishLine = this.add.container(centerX, -200);
            let checkeredLine = this.add.graphics();
            let sqSize = 40;
            for (let i = 0; i < 15; i++) {
                for (let j = 0; j < 2; j++) {
                    checkeredLine.fillStyle((i + j) % 2 === 0 ? 0xffffff : 0x000000, 1);
                    checkeredLine.fillRect(-300 + i * sqSize, j * sqSize, sqSize, sqSize);
                }
            }
            let schoolSign = this.add.rectangle(0, -60, 250, 80, 0x2980b9).setStrokeStyle(4, 0xffffff);
            let schoolText = this.add.text(0, -60, 'TRƯỜNG HỌC', { fontSize: '32px', color: '#fff', fontWeight: 'bold' }).setOrigin(0.5);
            finishLine.add([checkeredLine, schoolSign, schoolText]);
            finishLine.setDepth(5);

            // 7. Ô tô
            car = this.add.container(centerX, height * 0.8);
            smokeEmitter.startFollow(car);

            let shadow = this.add.rectangle(8, 8, 70, 120, 0x000000, 0.4);
            let body = this.add.graphics();
            body.fillStyle(0xe74c3c, 1);
            body.fillRoundedRect(-35, -60, 70, 120, 15);

            let windows = this.add.graphics();
            windows.fillStyle(0x3498db, 0.9);
            windows.fillRoundedRect(-28, -35, 56, 35, 5); // Kính trước
            windows.fillRoundedRect(-28, 30, 56, 20, 3);  // Kính sau

            car.add([shadow, body, windows]);
            car.add(this.add.circle(-25, -55, 8, 0xf1c40f)); // Đèn pha
            car.add(this.add.circle(25, -55, 8, 0xf1c40f));

            let brakeLightL = this.add.rectangle(-25, 55, 15, 8, 0xcc0000);
            let brakeLightR = this.add.rectangle(25, 55, 15, 8, 0xcc0000);
            brakeGlowL = this.add.circle(-25, 55, 20, 0xff0000, 0.8).setAlpha(0);
            brakeGlowR = this.add.circle(25, 55, 20, 0xff0000, 0.8).setAlpha(0);
            car.add([brakeLightL, brakeLightR, brakeGlowL, brakeGlowR]);

            let wheelColor = 0x111111;
            car.add(this.add.rectangle(-40, -35, 10, 30, wheelColor));
            car.add(this.add.rectangle(40, -35, 10, 30, wheelColor));
            car.add(this.add.rectangle(-40, 35, 10, 30, wheelColor));
            car.add(this.add.rectangle(40, 35, 10, 30, wheelColor));

            vibrateTween = this.tweens.add({
                targets: car,
                x: centerX + 1,
                yoyo: true,
                repeat: -1,
                duration: 40,
                ease: 'Sine.easeInOut'
            });

            // --- HÀM ĐẾM NGƯỢC LINH HOẠT (Có thêm tham số Delay) ---
            this.startCountdown = (seconds, delay = 0, callback) => {
                this.time.delayedCall(delay, () => {
                    countdownText.setAlpha(1);
                    for (let i = 0; i < seconds; i++) {
                        this.time.delayedCall(i * 1000, () => {
                            let current = seconds - i;
                            countdownText.setText(current.toString()).setScale(2);
                            this.tweens.add({ targets: countdownText, scaleX: 1, scaleY: 1, duration: 400, ease: 'Back.out' });
                            // Ẩn số sau khi đếm về 1
                            if (current === 1) {
                                this.time.delayedCall(1000, () => {
                                    countdownText.setAlpha(0);
                                });
                            }
                        });
                    }
                    if (callback) {
                        this.time.delayedCall(seconds * 1000, callback);
                    }
                });
            };

            // Bắt đầu đếm ngược cho Đèn Xanh sau khi cô giáo nói xong (chờ 5 giây)
            this.startCountdown(5, 4000);

            // PHÓNG TO ĐÈN XANH ngay từ đầu
            this.tweens.add({
                targets: trafficLightContainer,
                scaleX: 1.8, scaleY: 1.8, y: 150,
                duration: 500, ease: 'Back.out'
            });

            isPlaying = true;
            lastSwitchTime = this.time.now;

            // --- HIỆU ỨNG CHÚC MỪNG CHIẾN THẮNG (RƠI LIÊN TỤC) ---
            this.celebrateVictory = () => {
                const colors = [0xff4757, 0x2ecc71, 0x3498db, 0xf1c40f, 0xe67e22, 0x9b59b6];
                const { width, height } = this.cameras.main;

                this.confettiTimer = this.time.addEvent({
                    delay: 150,
                    callback: () => {
                        for (let i = 0; i < 5; i++) {
                            let x = Phaser.Math.Between(0, width);
                            let y = -20;
                            let size = Phaser.Math.Between(8, 15);
                            let confetti = this.add.rectangle(x, y, size, size, colors[Phaser.Math.Between(0, colors.length - 1)]);
                            confetti.setDepth(4000);
                            this.tweens.add({
                                targets: confetti,
                                y: height + 100,
                                x: x + Phaser.Math.Between(-200, 200),
                                angle: Phaser.Math.Between(360, 1080),
                                duration: Phaser.Math.Between(3000, 5000),
                                ease: 'Sine.inOut',
                                onComplete: () => confetti.destroy()
                            });
                        }
                    },
                    loop: true
                });
            };
        }

        function update(time, delta) {
            if (!isPlaying) return;
            const { width, height } = this.cameras.main;
            const centerX = width / 2;

            // Di chuyển cảnh vật (tạo hiệu ứng xe chạy)
            if (lightState === 'GREEN' || lightState === 'YELLOW') {
                for (let i = 0; i < lines.length; i++) {
                    lines[i].y += roadSpeed;
                    if (lines[i].y > height + 30) {
                        lines[i].y -= (height + 60);
                    }
                }

                // Di chuyển hàng rào
                for (let i = 0; i < fenceItemsL.length; i++) {
                    fenceItemsL[i].y += roadSpeed;
                    if (fenceItemsL[i].y > height + 50) fenceItemsL[i].y -= (height + 100);
                }
                for (let i = 0; i < fenceItemsR.length; i++) {
                    fenceItemsR[i].y += roadSpeed;
                    if (fenceItemsR[i].y > height + 50) fenceItemsR[i].y -= (height + 100);
                }

                // Di chuyển cây cối, hoa, ghế, đèn (tốc độ chậm hơn = parallax)
                let gardenSpeed = roadSpeed * 0.7;
                for (let i = 0; i < gardenItems.length; i++) {
                    gardenItems[i].y += gardenSpeed;
                    if (gardenItems[i].y > height + 100) {
                        if (!isGameOver) gardenItems[i].y -= (height + 200);
                    }
                }

                // Di chuyển vạch đích nếu đang kết thúc
                if (isGameOver) {
                    finishLine.y += roadSpeed;
                    if (finishLine.y >= car.y - 100) {
                        // Dừng xe khi chạm vạch đích
                        roadSpeed = Math.max(0, roadSpeed - 0.1);
                        if (roadSpeed === 0) {
                            isPlaying = false;
                            vibrateTween.pause();
                            smokeEmitter.stop();
                            this.teacherSay("Hoan hô! Bé đã tới trường an toàn rồi! Bé giỏi quá!", 5000);

                            // Hiển thị overlay sau một chút
                            this.time.delayedCall(1000, () => {
                                this.celebrateVictory();
                                document.getElementById('winOverlay').style.display = 'flex';
                                document.getElementById('pauseBtn').style.display = 'none';
                            });
                        }
                    }
                }
            }

            // Logic chuyển đèn
            if (isGameOver) return; // Không chuyển đèn nữa nếu đang về đích
            let currentTime = this.time.now;
            let elapsed = currentTime - lastSwitchTime;

            // XANH -> VÀNG (Sau 10 giây)
            if (lightState === 'GREEN' && elapsed > 10000) {
                lightState = 'YELLOW';
                lastSwitchTime = currentTime;
                roadSpeed = 2.0;

                playEffect('media/denvang.wav');
                this.teacherSay("Đèn vàng rồi, các bạn nhỏ cần phải như thế nào nhỉ ?", 8000);
                greenLight.setAlpha(0);
                greenGlow.setAlpha(0);
                yellowLight.setAlpha(1);
                yellowGlow.setAlpha(1);

                // Ẩn số đếm của đèn cũ
                countdownText.setAlpha(0);

                // Thu nhỏ đèn xanh cũ và phóng to đèn vàng mới
                this.tweens.add({
                    targets: trafficLightContainer,
                    scaleX: 1, scaleY: 1, y: 80,
                    duration: 300, ease: 'Back.in',
                    onComplete: () => {
                        this.tweens.add({
                            targets: trafficLightContainer,
                            scaleX: 1.8, scaleY: 1.8, y: 150,
                            duration: 500, ease: 'Back.out'
                        });
                    }
                });

                // Chờ 5 giây rồi mới đếm ngược cho đèn vàng
                this.startCountdown(5, 5000);

                // Hiệu ứng phanh nhẹ giảm tốc
                brakeGlowL.setAlpha(0.5);
                brakeGlowR.setAlpha(0.5);
                this.tweens.add({
                    targets: car,
                    y: height * 0.78,
                    duration: 300,
                    ease: 'Quad.out'
                });
            }
            // VÀNG -> ĐỎ (Sau 2 giây)
            else if (lightState === 'YELLOW' && elapsed > 10000) {
                lightState = 'RED';
                lastSwitchTime = currentTime;
                roadSpeed = 0;

                playWarningBeep();

                // Tạm dừng rung lắc vì xe đã dừng hẳn
                this.time.delayedCall(300, () => vibrateTween.pause());

                yellowLight.setAlpha(0);
                yellowGlow.setAlpha(0);
                redLight.setAlpha(1);
                redGlow.setAlpha(1);

                // Ẩn số đếm của đèn cũ
                countdownText.setAlpha(0);

                // Bật đèn phanh đỏ chót
                brakeGlowL.setAlpha(1);
                brakeGlowR.setAlpha(1);

                // Thu nhỏ đèn vàng và PHÓNG TO ĐÈN ĐỎ
                this.tweens.add({
                    targets: trafficLightContainer,
                    scaleX: 1, scaleY: 1, y: 80,
                    duration: 300, ease: 'Back.in',
                    onComplete: () => {
                        this.tweens.add({
                            targets: trafficLightContainer,
                            scaleX: 1.8, scaleY: 1.8, y: 150,
                            duration: 500, ease: 'Back.out'
                        });
                    }
                });

                // Hiển thị vạch đi bộ
                crosswalk.y = height / 2 - 50;
                this.tweens.add({
                    targets: crosswalk,
                    alpha: 1,
                    y: height / 2 + 80,
                    duration: 600,
                    ease: 'Cubic.out'
                });

                // === ĐÈN ĐỎ: CHỜ 5 GIÂY, ĐẾM 5 GIÂY RỒI VỀ ĐÍCH ===
                playEffect('media/dendo.wav');
                this.teacherSay("Đèn đỏ rồi, chúng ta cần phải làm như thế nào?", 8000);

                this.startCountdown(5, 5000, () => {
                    // KẾT THÚC GAME NGAY TẠI ĐÈN ĐỎ
                    countdownText.setText('BÉ ĐÃ TỚI TRƯỜNG!');
                    countdownText.setStyle({ color: '#2ECC71', fontSize: '64px' });
                    countdownText.setScale(1);
                    this.tweens.add({ targets: countdownText, scaleX: 1.2, scaleY: 1.2, duration: 1000, ease: 'Power2' });

                    isGameOver = true;
                    roadSpeed = 0; // Dừng hẳn xe
                    isPlaying = false; // Dừng loop game

                    vibrateTween.pause();
                    smokeEmitter.stop();
                    brakeGlowL.setAlpha(1);
                    brakeGlowR.setAlpha(1);

                    this.teacherSay("Chúc mừng bé đã tới trường an toàn! Bé giỏi quá!", 10000);

                    // Chạy hiệu ứng pháo hoa giấy rực rỡ
                    this.celebrateVictory();

                    // Hiển thị overlay chúc mừng sau 10 giây
                    this.time.delayedCall(10000, () => {
                        document.getElementById('winOverlay').style.display = 'flex';
                        document.getElementById('pauseBtn').style.display = 'none';
                    });
                });
            }

            // Hiệu ứng dừng (tạo vệt phanh)
            let skidL = this.add.rectangle(370, 500, 8, 40, 0x111111, 0.7);
            let skidR = this.add.rectangle(430, 500, 8, 40, 0x111111, 0.7);
            this.tweens.add({
                targets: [skidL, skidR],
                alpha: 0, duration: 2000,
                onComplete: () => { skidL.destroy(); skidR.destroy(); }
            });

            this.tweens.add({
                targets: car,
                y: 460, scaleY: 0.9, scaleX: 1.02,
                duration: 250, yoyo: true, ease: 'Quad.out',
                onComplete: () => {
                    car.scaleY = 1; car.scaleX = 1; car.y = 480;
                }
            });
        }
    </script>
</body>
